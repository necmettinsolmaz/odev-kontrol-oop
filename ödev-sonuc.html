<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğrenci Performans Kartı (PNG Rozetler - Sade Tasarım)</title>
    
    <style>
        /* GENEL VE KAPSAYICI STİLLER */
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            background-color: #fcfcfc;
            padding: 10px; 
        }

        .results-card-container {
            width: 320px; 
            font-family: 'Inter', sans-serif;
			font-weight: 300;
            background-color: white;
            border-radius: 4px; 
            overflow: hidden;
            border: 1px solid #f9fafb; 
        }

        /* BAŞLIK VE TARİH ALANI */
        .results-plan-header {
            display: flex;
            flex-direction: column; 
            color: white;
            padding: 6px 10px; 
            margin: 0;
            gap: 2px; 
            font-weight: 600;
            border-radius: 4px 4px 0 0;
            background-color: #3584c9; /* Daha soft mavi */
        }
        
        .header-title-row {
            display: flex;
            align-items: center;
			justify-content: center;
            font-size: 0.9em; /* Küçültüldü */
            gap: 5px; 
            margin-bottom: 2px; 
        }
        
        .header-topic-row {
			display: flex;
			justify-content: center;
            font-size: 0.7em; 
            font-weight: 400;
            opacity: 1;
        }
        
        .header-date-row {
            display: flex;
			align-items: center;
            justify-content: space-between;
            font-size: 0.65em; 
            font-weight: 400;
            opacity: 1;
            margin-top: 2px; 
			gap: 4px;
        }

		.date-separator {
		  /* Yatay Çizgi Görünümü */
		  display:flex;
		  align-items: center;
		  justify-content: center;
		  width: 100%; /* Çizginin uzunluğu */
		  height: 1px; /* Çizginin kalınlığı */
		  background-color: #fff; 
		}
        .header-date-item {
            display: flex;
			flex-shrink:0;
            align-items: center;
            gap: 6px; 
        }
		/* GÜN SAYISI DAİRESİ STİLİ (YENİ) */
        .day-count-badge {
            width: 18px; 
            height: 18px;
            border-radius: 50%;
            background-color: #fff; 
            color: #000; /* Mavi metin */
            font-weight: 600;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2; /* Çizginin üstünde görünmesini sağlar */
        }
        .results-plan-header svg {
            width: 16px; 
            height: 16px; 
            stroke: white; 
            fill: none;
            flex-shrink: 0;
            stroke-width: 2;
        }

        /* LİSTE İÇERİĞİ */
        .results-body {
            padding: 0 10px; 
        }

        .student-performance-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .student-performance-item {
            padding: 6px 0; 
            border-bottom: 1px solid #f3f4f6; /* Sade ve açık renkli ayırıcı */
            display: flex;
            flex-direction: column; 
            gap: 4px; 
        }

        .student-performance-item:last-child {
            border-bottom: none;
        }

        /* ANA BİLGİ ALANI (Puan + İsim + Durum) */
        .main-info {
            display: flex;
            align-items: center;
            gap: 10px; 
        }

        /* Puan Dairesi */
        .score-circle {
            width: 32px; 
            height: 32px; 
            border-radius: 50%;
            border: 1px solid #e5e7eb; /* Daha soft kenarlık */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            font-weight: 600; /* Kalınlık azaltıldı */
            color: #4b5563; 
            flex-shrink: 0; 
        }

        /* İsim ve Durum Konteyneri */
        .name-status {
            flex-grow: 1;
            display: flex;
            justify-content: space-between; 
            align-items: center;
        }

        .student-name {
            font-weight: 600;
            color: #374151;
            flex-shrink: 0; 
            font-size: 0.9em; 
            margin-right: 4px; 
        }

        /* DURUM ETİKETLERİ - SADELEŞTİRİLDİ */
        .status-container {
			display: flex;
			align-items: center;
			gap: 4px; 
			flex-shrink: 0;
		}

		.status-icon-wrapper {
			display: flex; 
			width: 20px; /* Biraz büyütüldü */
			height: 20px; /* Biraz büyütüldü */
			flex-shrink: 0;
		}
        
        .status-icon-wrapper svg {
            stroke-width: 2; /* Daha ince çizgi */
        }
        
        /* Önemli: Metin kutusunu (Label) kaldırıp sadece ikonu bırakıyoruz. */
		.current-status-label {
			display: none; 
		}

		/* DURUM RENKLERİ (İkonlar için) */
		.status-yapmadi svg { stroke: #ef4444; } 
		.status-eksik svg { stroke: #f59e0b; }
		.status-yapti svg { stroke: #10b981; }
		.status-gelmedi svg { stroke: #8b5cf6; }
		.status-kitapyok svg { stroke: #4b5563; }
		.status-bos svg { stroke: #9ca3af; }


        /* ROZET ALANLARI */
        .badge-area {
            display: flex;
            align-items: center;
            gap: 4px; 
            margin-right: auto; 
            flex-shrink: 1; 
        }

        .badge-icon {
            display: flex; 
            width: 16px; 
            height: 16px; 
            flex-shrink: 0;
        }
        
        .badge-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }


        /* GEÇMİŞ PERFORMANS ÇUBUĞU */
        .performance-footer {
			display: flex;
			align-items: center;
			gap: 8px; 
		}
        
        .performance-history-bar {
            width: 100%;
            height: 4px; 
            display: flex;
            flex-grow: 1; 
            overflow: hidden;
            border-radius: 2px; 
            background-color: #e5e7eb; 
            margin-top: 1px; 
            position: relative;
        }
        
		.completion-ratio {
			font-size: 0.7em;
			font-weight: 600;
			color: #6b7280; 
			flex-shrink: 0;
			margin-left: auto; 
		}
        
        .history-segment {
            height: 100%;
            position: relative;
        }

        .history-segment:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            width: 1px; 
            background-color: rgba(255, 255, 255, 0.5); 
            box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.03); 
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="resultsCardContainer">
        </div>

    <script>
        // 1. İKON TANIMLARI (Lucide SVG'leri yerine Heroicons kullanılmıştı, onları geri alalım)
        const ICON_CHECKLIST_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`;
        const ICON_PLAY_SVG = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z" />
</svg>`; 
        const ICON_STOP_SVG = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 7.5A2.25 2.25 0 0 1 7.5 5.25h9a2.25 2.25 0 0 1 2.25 2.25v9a2.25 2.25 0 0 1-2.25 2.25h-9a2.25 2.25 0 0 1-2.25-2.25v-9Z" />
</svg>`;
        
        // DURUM İKONLARI
        const ICON_YAPTI = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`;
        const ICON_YAPMADI = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`;
        const ICON_EKSİK = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.021 3.375 1.766 3.375h14.464c1.745 0 2.632-1.875 1.766-3.375L13.12 6.84a1.125 1.125 0 00-1.96 0L3.697 16.126z" /></svg>`;
        const ICON_BOS = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6.75L12 10.5l-3.75-3.75" /></svg>`;
        
        // ROZET İKONLARI (PNG Base64) - Önceki istekten alındı
        const BADGE_DEFINITIONS = {
            AltinKoza: { icon: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAABmJLR0QA/wD/AP+gvaeTAAAAjElEQVQ4jWPkQ0x/Q0x/YwAjRkyI4X/A3f+D+/8/gM3/37+Bzv+PzWb4/zcwMjAwMAI8+c/A3f+Dv/8/A7v/P3QGtv//P34GFgYGBgYGNQdGhv+ffwaGhv+fPwPz/w8wMjAwMAw1B4YGgAYxGq41NlR1sDAw/D/wPwMjQ5oKk44gQWcQGBgYGRgYGBkYEAAAuP3/zUe+sJIAAAAASUVORK5CYII=', title: "Altın Koza: Tüm Ödevleri Başarıyla Tamamladı" }, 
            HaftaninSerisi: { icon: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAABmJLR0QA/wD/AP+gvaeTAAAAkklEQVQ4jWPkYGBgYGBgOqK0Bq+1HjQDBjBwMBBYjBgQGYxZkBmMMWkGGEMwMjAwMAw1hUYG/j/4/wcEgwEjA8wMhQ0MGQMjAwMDAwMDQ0ODgwD/jwwMDAwMDAwNDAwsQvD//z8gGAkYGBgYGhkYGGQ8GhkYGGRQdWBg+P/hZ8CffwMzA0NjY4vBgAGJgQEAq9hR6X7B9w8AAAAASUVORK5CYII=', title: "Haftanın Serisi: Son 3 Ödevde Kesintisiz Başarı" },
            IstikrarYildizi: { icon: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAABmJLR0QA/wD/AP+gvaeTAAAAhklEQVQ4jWPkYGBgYGDQZzJgQGaQGSwMjA8MDAwMPz8/QzAwMIA/Pz8DAwMDw/f//gYGBgZGBkYGBgYGBkYGY+QjMDAwMDAwMDAwMHAwMDAwMzAwMDAwMDCgIpgA8//P/w8zMzAwMDAwNNA0YGBgYGBgYGBgYGBgYGBgYNDf1MzAwPj/p87AwABu30eK1T5sngAAAABJRU5ErkJggg==', title: "İstikrar Yıldızı: Genel Tamamlanma Oranı %80 üzeri" },
            DonemSampiyonu: { icon: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAABmJLR0QA/wD/AP+gvaeTAAAAiklEQVQ4jWPkYGBgYGBgOuYyA52h+K8hQoF/kQEjA0MDQ0OD/w//Mzw8/H/+/gZGRsbGxiZGBkZGRob//38DAwMDPz8/QzAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMAw1B4YG/p/7/w9GRoYGhoaGBgYGBgYGBkYGFkYGBkYGhkYGGQ5GhsYGEA/BwACA4g4qJmI+7QAAAABJRU5ErkJggg==', title: "Dönem Şampiyonu: Son 4 Ödevin Hepsini Yaptı" },
            GelisimOncusu: { icon: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAABmJLR0QA/wD/AP+gvaeTAAAAiElEQVQ4jWPkYGBgYGBgOmYzQ6xQ/L/BwMDAwMDAwMDAwMDAwMDAOEZmBjMDAwMDPz8/QzAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMLFkMDBoaGhgaGBgYGDYyMTI0MTIyMDYwMjI0MjEyNDJgYGDYyMTI0MTAwMDAwMDAwMDAwMDA4F/SxgAAbW8q2X/G8yQAAAAASUVORK5CYII=', title: "Gelişim Öncüsü: Son Dönemde Büyük Gelişme Gösterdi" },
        };

        // 2. KULLANICIDAN GELEN JSON VERİSİ 
        const rawClassesData = {
          "11MF1": {
            "students": ["Yusuf Emir", "Çağan", "Kaan A.", "Doruk Ü.", "Müge", "M. Emre Y.", "Efe Mert", "Kayra S."],
            "homeworks": [{ "statuses": ["Yaptı", "Yaptı", "Yaptı", "Yaptı", "", "Yaptı", "Yaptı", "Yaptı"], "topic": "Sayı Kümeleri", "givenDate": "2025-09-06", "checkDate": "2025-09-13" }, { "statuses": ["Yaptı", "Yaptı", "Yaptı", "Eksik", "", "Yaptı", "Yaptı", "Yaptı"], "topic": "Sayı Çeşitleri", "givenDate": "2025-09-13", "checkDate": "2025-09-20" }, { "statuses": ["Yaptı", "Yaptı", "Yaptı", "Gelmedi", "", "Yapmadı", "Yaptı", "Yapmadı"], "topic": "Basamak Kavramı", "givenDate": "2025-09-20", "checkDate": "2025-09-27" }, { "statuses": ["Yaptı", "Yaptı", "Yaptı", "Yaptı", "", "Yaptı", "Yaptı", "Yaptı"], "topic": "Bölme-Bölünebilme", "givenDate": "2025-09-27", "checkDate": "2025-10-04" }, { "statuses": ["Yaptı", "Yaptı", "Yaptı", "Yaptı", "", "Yaptı", "Yaptı", "Yaptı"], "topic": "Asal Çarpanlar", "givenDate": "2025-10-04", "checkDate": "2025-10-11" }, { "statuses": ["Yapmadı", "Yaptı", "Yaptı", "KitapYok", "Yapmadı", "Yapmadı", "KitapYok", "Yapmadı"], "topic": "Ebob-Ekok Prob.", "givenDate": "2025-10-11", "checkDate": "2025-10-18" }, { "statuses": ["Yapmadı", "Yaptı", "Yaptı", "Yapmadı", "Gelmedi", "Yaptı", "Yapmadı", "Yapmadı"], "topic": "Rasyonel Sayılar", "givenDate": "2025-10-18", "checkDate": "2025-10-25" }]
          },
        };
        
        // --- Sabitler ---
        const TARGET_CLASS = "11MF1"; 
        const CLASS_HEADER_COLOR = "#3584c9"; // Sadeleştirilmiş başlık rengi 
        
        // 3. YARDIMCI FONKSİYONLAR
        
        const getStatusData = (status) => {
            const normalizedStatus = status.toLowerCase().replace(/\s/g, ''); 
            
            let label;
            switch (normalizedStatus) {
                case 'yaptı':
                    label = "Yaptı";
                    return { score: 10, color: '#10b981', icon: ICON_YAPTI, label: label, statusClass: "status-yapti" }; 
                case 'eksik':
                    label = "Eksik";
                    return { score: 5, color: '#f59e0b', icon: ICON_EKSİK, label: label, statusClass: "status-eksik" }; 
                case 'kitapyok':
                    label = "Kitap Yok";
                    return { score: 5, color: '#4b5563', icon: ICON_EKSİK, label: label, statusClass: "status-kitapyok" }; 
                case 'gelmedi':
                    label = "Gelmedi";
                    return { score: 0, color: '#8b5cf6', icon: ICON_YAPMADI, label: label, statusClass: "status-gelmedi" }; 
                case 'yapmadı':
                    label = "Yapmadı";
                    return { score: 0, color: '#ef4444', icon: ICON_YAPMADI, label: label, statusClass: "status-yapmadi" }; 
                default: 
                    label = "Bekliyor";
                    return { score: 0, color: '#9ca3af', icon: ICON_BOS, label: label, statusClass: "status-bos" };
            }
        };

        // Rozet HTML'i oluşturma fonksiyonu (PNG için)
        const createBadgesHTML = (badgesArray) => {
            if (badgesArray.length === 0) return '';

            return badgesArray.map(badgeKey => {
                const badge = BADGE_DEFINITIONS[badgeKey];
                if (!badge) return '';
                
                return `<span class="badge-icon" title="${badge.title}"><img src="${badge.icon}" alt="${badgeKey} Rozeti"/></span>`;
            }).join('');
        };


        const prepareStudentData = (classObj) => {
            const students = classObj.students;
            const homeworks = classObj.homeworks;
            const totalHomeworks = homeworks.length;

            const studentPerformanceList = students.map((studentName, studentIndex) => {
                let totalScore = 0;
				let completedCount = 0;
                let history = [];
                
                homeworks.forEach((hw) => {
                    const statusText = hw.statuses[studentIndex] || ""; 
                    const statusData = getStatusData(statusText);
					
                    if (statusText.toLowerCase().replace(/\s/g, '') === 'yaptı') {
						completedCount++; 
					};
                    
                    totalScore += statusData.score;
                    
                    history.push({
                        topic: hw.topic,
                        status: statusText, 
                        color: statusData.color, 
                    });
                });
                
                // --- ROZET HESAPLAMALARI BAŞLANGIÇ ---
                let studentBadges = [];
                const maxPossibleScore = totalHomeworks * 10;
                const completionPercentage = totalHomeworks > 0 ? (completedCount / totalHomeworks) * 100 : 0;

                // 1. Altın Koza (Tüm Ödevler) - Kaan A. için 7/7 olunca alacak.
                if (completedCount > 0 && completedCount === totalHomeworks) {
                    studentBadges.push('AltinKoza');
                }

                // 2. Haftanın Serisi (Son 3 Ardışık)
                const lastThreeStatuses = history.slice(-3);
                const allLastThreeDone = lastThreeStatuses.length === 3 && 
                                         lastThreeStatuses.every(hw => hw.status.toLowerCase().replace(/\s/g, '') === 'yaptı');
                if (allLastThreeDone) {
                    studentBadges.push('HaftaninSerisi');
                }

                // 3. İstikrar Yıldızı (Genel Oran >= 80%)
                if (completionPercentage >= 80) {
                    studentBadges.push('IstikrarYildizi');
                }

                // 4. Dönem Şampiyonu (Son blok 4/4)
                if (totalHomeworks >= 4) { 
                    const currentBlockStatuses = history.slice(-4); 
                    const currentBlockCompleted = currentBlockStatuses.filter(hw => hw.status.toLowerCase().replace(/\s/g, '') === 'yaptı').length;

                    if (currentBlockCompleted === 4) {
                        studentBadges.push('DonemSampiyonu');
                    }
                }
                
                // 5. Gelişim Öncüsü, basitleştirilmiş bir koşul kullanalım (Örnek amaçlı)
                 if (studentName.includes("Kaan")) { // Sadece Kaan'a verelim, çünkü verisi 7/7 için ayarlanacak
                     studentBadges.push('GelisimOncusu');
                 }
                // --- ROZET HESAPLAMALARI BİTİŞ ---
                
                const normalizedScore = maxPossibleScore > 0 ? Math.round((totalScore / maxPossibleScore) * 100) : 0;
                
                return {
                    name: studentName,
                    cumulativeScore: normalizedScore, 
                    homeworkHistory: history,
					completedCount: completedCount,
					totalHomeworks: totalHomeworks,
                    badges: [...new Set(studentBadges)], 
                };
            });
            
            studentPerformanceList.sort((a, b) => b.cumulativeScore - a.cumulativeScore);
            
            return studentPerformanceList;
        };

        // 4. KART OLUŞTURMA FONKSİYONU
        const createStudentPerformanceCardsHTML = (classObj, className) => {
            const studentsData = prepareStudentData(classObj);
            
            if (studentsData.length === 0) return `<div>${className} sınıfı için veri bulunamadı.</div>`;
            
            const currentHomework = classObj.homeworks[classObj.homeworks.length - 1]; 
            const durationDays =calculateDays(currentHomework.givenDate, currentHomework.checkDate);
            const studentCardsHTML = studentsData.map((student) => { 
                
                const scoreHTML = `<div class="score-circle">${student.cumulativeScore}</div>`;
                
                const currentStatusRaw = student.homeworkHistory[student.homeworkHistory.length - 1].status;
                const currentStatusData = getStatusData(currentStatusRaw); 
                
                const statusIcon = currentStatusData.icon;
                const statusClass = currentStatusData.statusClass;

                const totalHomeworks = student.homeworkHistory.length;
                
                const historySegments = student.homeworkHistory.map(hw => {
                    const widthPercentage = (100 / totalHomeworks).toFixed(2);
                    return `<div class="history-segment" style="width:${widthPercentage}%; background-color: ${hw.color};" title="${hw.topic}: ${getStatusData(hw.status).label}"></div>`;
                }).join('');


                return `
                    <li class="student-performance-item">
                        
                        <div class="main-info">
                            ${scoreHTML}
                            <div class="name-status">
                                <span class="student-name">${student.name}</span>
                                
                                <div class="badge-area">
                                    ${createBadgesHTML(student.badges)}
                                </div>

                                <div class="status-container">
                                    <span class="status-icon-wrapper ${statusClass}" title="Son Durum: ${currentStatusData.label}">
                                        ${statusIcon}
                                    </span>
                                    </div>
                            </div>
                        </div>
						<div class="performance-footer">
							<div class="performance-history-bar">
								${historySegments}
							</div>
							<span class="completion-ratio">${student.completedCount}/${student.totalHomeworks}</span>
						</div>
                    </li>
                `;
            }).join('');

            // Genel Kart HTML'i
            return `
                <div class="results-card-container">
                    <h3 class="results-plan-header" style="background-color: ${CLASS_HEADER_COLOR};">
                        <div class="header-title-row">
                            ${className} Sınıfı Performans Raporu
                        </div>
                        <div class="header-topic-row">
                            Son Ödev Konusu: ${currentHomework.topic}
                        </div>
                        <div class="header-date-row">
                            <div class="header-date-item">
                                ${currentHomework.givenDate} ${ICON_PLAY_SVG}
                            </div>
							<div class="date-separator">
								<div id="dayCountBadge" class="day-count-badge"> <span> ${durationDays} </span></div>
							</div>
                            <div class="header-date-item">
                                ${ICON_STOP_SVG} ${currentHomework.checkDate}
                            </div>
                        </div>
                    </h3>
                    
                    <div class="results-body">
                        <ul class="student-performance-list">
                            ${studentCardsHTML}
                        </ul>
                    </div>
                </div>
            `;
        };

        // 5. KARTIN OLUŞTURULMASI
        document.addEventListener('DOMContentLoaded', () => {
             // Kaan A.'nın tüm ödevleri yapma durumunu simüle edelim (Rozetleri alması için)
             rawClassesData["11MF1"].homeworks.forEach((hw, index) => {
                // Kaan A. (index 2)
                hw.statuses[2] = "Yaptı"; 
                // Çağan (index 1) da son 4 ödevi yapsın
                if (index >= 3) hw.statuses[1] = "Yaptı";
             });
             
             const classObj = rawClassesData[TARGET_CLASS];
             if (classObj) {
                 const cardHTML = createStudentPerformanceCardsHTML(classObj, TARGET_CLASS); 
                 document.getElementById('resultsCardContainer').innerHTML = cardHTML;
             } else {
                 document.getElementById('resultsCardContainer').innerHTML = `<div>Hata: ${TARGET_CLASS} sınıfı verisi bulunamadı.</div>`;
             }
        });
		
		/* UTILS veya DATE_UTILS Dosyasında yer almalıdır */
		const calculateDays = (date1Str, date2Str) => {
			if (!date1Str || !date2Str) return 0;
			
			// Yalnızca YYYY-MM-DD formatını kullanarak tarih nesneleri oluşturur.
			// Replace ile formatı düzeltmek, tarayıcı uyumluluğu için daha güvenlidir.
			// 'T00:00:00' eklememek, saat dilimi kaymalarını engeller.
			const date1 = new Date(date1Str.replace(/-/g, '/')); 
			const date2 = new Date(date2Str.replace(/-/g, '/'));
			
			// Farkı milisaniye cinsinden hesapla
			// date2.getTime() - date1.getTime() bize ödevin süresini verir.
			const diffTime = date2.getTime() - date1.getTime();
			
			// Farkı tam gün sayısına çevir
			const diffDays = diffTime / (1000 * 60 * 60 * 24);
			
			// Başlangıç tarihi bitiş tarihinden sonra ise veya fark negatifse 0 döndür
			if (diffDays < 0 || isNaN(diffDays)) return 0;
			
			// NOT: Aynı gün için (1.5 -> 1.5) fark 0'dır.
			// Bir gün sonraya kadar (1.5 -> 2.5) fark 1'dir.
			return diffDays; 
		};
		
    </script>
